# CodeRabbit Configuration for CLM Platform Monorepo
# Reference: docs/architecture-guide.md

language: "en-US"
tone_instructions: "Be concise, actionable, and prioritize security vulnerabilities and clean architecture violations."

reviews:
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "draft"

chat:
  auto_reply: true

# Custom prompt instructions enforcing the project's strict architectural boundaries
custom_prompt: |
  You are the Lead Security and Clean Architecture Reviewer for the CLM Platform Monorepo.
  Strictly enforce the following rules on every review:

  1. BOUNDARY INTEGRITY:
     - Frontends (`apps/*-portal`) must NEVER import from `apps/backend`.
     - Backend (`apps/backend`) must NEVER import from any frontend.
     - Frontend must NEVER contain direct API URL strings; ALL endpoint calls must go through `packages/api-client`.
     - Gateway (`apps/gateway`) communicates with backend ONLY via typed contracts.

  2. BACKEND LAYER RULES (NestJS):
     - Controllers: Routes, DTO validation, and calling ONE service method ONLY. No raw SQL, no business if/else, no KMS/AWS calls in controllers.
     - Every endpoint MUST have an explicit `@Roles(...)` and `@UseGuards()`. Default deny!
     - Every input must be validated via class-validator DTOs (`whitelist: true`, `forbidNonWhitelisted: true`).
     - Services: Handle business rules and transactions. No req/res objects.
     - Repositories: Queries and mappings only.
     - Multi-Tenancy: Every tenant query must be scoped by `tenant_id` and respect PostgreSQL Row-Level Security (RLS) (`SET LOCAL app.tenant_id`).

  3. SECURITY & CRYPTO:
     - PRIVATE KEYS MUST NEVER LEAVE THE GATEWAY. Flag ANY attempt to send private keys or key material to the control plane.
     - No open inbound ports or HTTP servers on the customer gateway agent (outbound HTTPS 443 only).
     - Gateway commands must be typed and signed (no arbitrary shell/exec commands).
     - Never store customer cloud access keys if IAM roles or Workload Identity can be used; otherwise enforce KMS envelope encryption.
     - No tokens or sensitive secrets stored in browser `localStorage`. Refresh tokens must be in httpOnly, Secure cookies.

  4. FRONTEND RULES:
     - No business logic in components or pages.
     - Never use `dangerouslySetInnerHTML` (certificate data is untrusted).
     - All server state must be managed via TanStack Query.

